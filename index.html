<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6fb">
  <title>待办清单</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      color: #24263a;
      background: #f5f6fb;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: 72px 20px;
      background:
        radial-gradient(ellipse at 50% 0, rgba(117, 103, 255, 0.1), transparent 38rem),
        #f5f6fb;
    }

    .app {
      width: min(100%, 560px);
      margin: 0 auto;
    }

    .heading {
      margin-bottom: 28px;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: #7567e8;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 7vw, 2.65rem);
      letter-spacing: -0.045em;
    }

    .subtitle {
      margin: 10px 0 0;
      color: #77798b;
      font-size: 0.98rem;
    }

    .card {
      overflow: hidden;
      border: 1px solid #e9e9f1;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 18px 55px rgba(37, 36, 74, 0.08);
    }

    form {
      display: flex;
      gap: 10px;
      padding: 22px;
      border-bottom: 1px solid #f0f0f5;
    }

    input {
      flex: 1;
      min-width: 0;
      height: 48px;
      padding: 0 15px;
      border: 1px solid #e4e4ed;
      border-radius: 11px;
      outline: none;
      color: inherit;
      font: inherit;
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    input::placeholder {
      color: #a0a1ae;
    }

    input:focus {
      border-color: #887cf0;
      box-shadow: 0 0 0 3px rgba(117, 103, 232, 0.14);
    }

    button {
      font: inherit;
    }

    .add-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-width: 104px;
      padding: 0 17px;
      border: 0;
      border-radius: 11px;
      background: #7567e8;
      color: #fff;
      font-weight: 650;
      cursor: pointer;
      transition: background 160ms ease, transform 160ms ease;
    }

    .add-button:hover {
      background: #6557d7;
    }

    .add-button:active {
      transform: translateY(1px);
    }

    .add-button:focus-visible,
    .delete-button:focus-visible {
      outline: 3px solid rgba(117, 103, 232, 0.35);
      outline-offset: 2px;
    }

    .list-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 17px 22px 10px;
    }

    .list-header h2 {
      margin: 0;
      font-size: 0.9rem;
      font-weight: 700;
    }

    .count {
      color: #858697;
      font-size: 0.82rem;
    }

    ul {
      display: grid;
      gap: 2px;
      margin: 0;
      padding: 0 12px 12px;
      list-style: none;
    }

    .todo-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 56px;
      padding: 8px 10px 8px 12px;
      border-radius: 10px;
      animation: appear 180ms ease-out;
    }

    .todo-item:hover {
      background: #f8f8fc;
    }

    .todo-label {
      display: flex;
      flex: 1;
      align-items: center;
      gap: 10px;
      min-width: 0;
      cursor: pointer;
    }

    .todo-checkbox {
      flex: 0 0 18px;
      width: 18px;
      height: 18px;
      margin: 0;
      accent-color: #7567e8;
      cursor: pointer;
    }

    .todo-checkbox:focus-visible {
      outline: 3px solid rgba(117, 103, 232, 0.35);
      outline-offset: 2px;
    }

    .todo-text {
      min-width: 0;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    .todo-item.is-completed .todo-text {
      color: #9899a8;
      text-decoration: line-through;
      text-decoration-thickness: 1.5px;
    }

    .delete-button {
      display: grid;
      flex: 0 0 36px;
      width: 36px;
      height: 36px;
      place-items: center;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: #999aaa;
      cursor: pointer;
      transition: color 160ms ease, background 160ms ease;
    }

    .delete-button:hover {
      background: #fff0f0;
      color: #d34f5a;
    }

    .delete-button svg {
      width: 18px;
      height: 18px;
    }

    .empty-state {
      padding: 26px 20px 34px;
      color: #858697;
      text-align: center;
      font-size: 0.92rem;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      body {
        padding: 48px 16px;
      }

      form {
        gap: 8px;
        padding: 16px;
      }

      .add-button {
        min-width: 88px;
        padding: 0 12px;
      }

      .list-header {
        padding-right: 18px;
        padding-left: 18px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="heading">
      <p class="eyebrow">YOUR DAY, IN FOCUS</p>
      <h1>待办清单</h1>
      <p class="subtitle">把想做的事写下来，一件一件完成。</p>
    </header>

    <section class="card" aria-labelledby="list-title">
      <form id="todo-form">
        <input
          id="todo-input"
          name="todo"
          type="text"
          placeholder="接下来要做什么？"
          aria-label="新的待办事项"
          autocomplete="off"
          required
        >
        <button class="add-button" type="submit">
          <span aria-hidden="true">＋</span>
          添加
        </button>
      </form>

      <div class="list-header">
        <h2 id="list-title">我的事项</h2>
        <span class="count" id="todo-count" aria-live="polite">0 项未完成</span>
      </div>
      <ul id="todo-list" aria-label="待办事项列表"></ul>
      <p class="empty-state" id="empty-state">还没有待办事项，添加一项开始吧。</p>
    </section>
  </main>

  <script>
    const form = document.querySelector("#todo-form");
    const input = document.querySelector("#todo-input");
    const list = document.querySelector("#todo-list");
    const count = document.querySelector("#todo-count");
    const emptyState = document.querySelector("#empty-state");

    function updateSummary() {
      const remaining = list.querySelectorAll(".todo-checkbox:not(:checked)").length;
      count.textContent = `${remaining} 项未完成`;
      emptyState.hidden = list.children.length > 0;
    }

    function addTodo(text) {
      const item = document.createElement("li");
      item.className = "todo-item";

      const taskLabel = document.createElement("label");
      taskLabel.className = "todo-label";

      const checkbox = document.createElement("input");
      checkbox.className = "todo-checkbox";
      checkbox.type = "checkbox";

      const label = document.createElement("span");
      label.className = "todo-text";
      label.textContent = text;

      checkbox.addEventListener("change", () => {
        item.classList.toggle("is-completed", checkbox.checked);
        updateSummary();
      });

      taskLabel.append(checkbox, label);

      const deleteButton = document.createElement("button");
      deleteButton.className = "delete-button";
      deleteButton.type = "button";
      deleteButton.setAttribute("aria-label", `删除：${text}`);
      deleteButton.innerHTML = `
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 7h16M10 11v6m4-6v6M6 7l1 13h10l1-13M9 7V4h6v3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      `;
      deleteButton.addEventListener("click", () => {
        item.remove();
        updateSummary();
      });

      item.append(taskLabel, deleteButton);
      list.append(item);
      updateSummary();
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) {
        input.focus();
        return;
      }

      addTodo(text);
      form.reset();
      input.focus();
    });

    updateSummary();
  </script>
</body>
</html>
